services:
  postgres:
    image: postgres:17-alpine
    container_name: code-review-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: code_review
      POSTGRES_USER: code_review_user
      POSTGRES_PASSWORD: code_review_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U code_review_user -d code_review"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - code-review-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: code-review-backend
    restart: unless-stopped

    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/code_review_agent?sslmode=disable"
      # DATABASE_URL: "postgres://code_review_user:code_review_password@postgres:5432/code_review?sslmode=disable"

      # DB_HOST: postgres
      # DB_PORT: "5432"
      # DB_NAME: code_review
      # DB_USER: code_review_user
      # DB_PASSWORD: code_review_password

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"

    networks:
      - code-review-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: code-review-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - code-review-network


volumes:
  postgres_data:


networks:
  code-review-network:
    driver: bridge